name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: Plugin manifests and skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin/
        run: python3 scripts/check_plugin.py

  cli:
    # The CLI runs on the user's own JDK, 17 or later, through the sh launcher
    # (under Git Bash on Windows) or the .bat one.
    name: CLI on ${{ matrix.os }}, Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: "17" }
          - { os: ubuntu-latest, java: "25" }
          - { os: macos-latest, java: "17" }
          - { os: windows-latest, java: "17" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Test
        shell: bash
        run: sh scripts/test-cli.sh

      - name: Run the cmd launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: plugin\cli\vaadin-agent-tools.bat check-theme-mixing test\fixtures\clean --json
